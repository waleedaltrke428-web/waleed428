<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إشارات الفيوتشرز</title>
<style>
:root{--bg:#0d1a21;--card:#152630;--card2:#1b303c;--line:#27404d;--tx:#e8eff2;--mut:#8fa6b1;--long:#3fc79a;--short:#ee6a56;--acc:#e3b34f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:30px;line-height:1.55}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}
#rf{background:var(--acc);color:#1a1405;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700}
#rf:disabled{opacity:.5}
#st{font-size:13px;color:var(--mut);margin-top:4px;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--long)}.dot.b{background:var(--acc);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px 0}
.t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.t b{display:block;font-size:20px}.t span{font-size:12px;color:var(--mut)}
.seg{display:flex;gap:6px;padding:12px 16px 4px}
.seg button{flex:1;background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit}
.seg button.on{background:var(--card2);color:var(--tx);border-color:var(--acc)}
#list{padding:8px 16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;border-inline-start:5px solid var(--long)}
.c.S{border-inline-start-color:var(--short)}
.h{display:flex;justify-content:space-between;align-items:center}
.sym{font-weight:800;font-size:19px;direction:ltr}
.bd{font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(63,199,154,.15);color:var(--long)}
.S .bd{background:rgba(238,106,86,.15);color:var(--short)}
.m{display:flex;gap:4px;margin:8px 0}.m i{flex:1;height:5px;border-radius:3px;background:var(--line)}.m i.f{background:var(--acc)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g div{background:var(--card2);border-radius:10px;padding:8px 10px}
.g span{display:block;font-size:12px;color:var(--mut)}.g b{direction:ltr;display:inline-block;font-size:15px}
.g .e b{color:var(--acc)}.g .s b{color:var(--short)}.g .p b{color:var(--long)}
.w{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.w em{font-style:normal;font-size:12px;background:var(--card2);border-radius:8px;padding:3px 8px;color:var(--mut)}
.cp{width:100%;background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}
.emp{text-align:center;color:var(--mut);padding:40px 20px}
.nt{font-size:12px;color:var(--mut);text-align:center;padding:0 20px}
</style></head><body>
<header><div class="top"><h1>إشارات الفيوتشرز</h1><button id="rf">فحص الآن</button></div>
<div id="st"><span class="dot" id="dt"></span><span id="stt">جاري التحميل...</span></div></header>
<div class="stats"><div class="t"><b id="n1">-</b><span>عملة مفحوصة</span></div><div class="t"><b id="n2">-</b><span>فرصة</span></div><div class="t"><b id="n3">-</b><span>شراء / بيع</span></div></div>
<div class="seg" id="sg"><button data-f="a" class="on">الكل</button><button data-f="L">شراء</button><button data-f="S">بيع</button></div>
<div id="list"></div>
<p class="nt">فحص تلقائي كل 15 دقيقة. الاتجاه من 4 ساعات واليومي، والدخول من 15 دقيقة. إشارات فنية وليست نصيحة مالية، التزم بوقف الخسارة.</p>
<script>
const A=window.Android;let cur='',F='a',busy0=null;
const fmt=x=>{const a=Math.abs(x);return a>=100?x.toFixed(2):a>=1?x.toFixed(4):a>=.01?x.toFixed(5):x.toPrecision(4)};
const $=id=>document.getElementById(id);
function msg(x){const L=x.long;return `${L?'🟢 شراء (LONG)':'🔴 بيع (SHORT)'} #${x.sym}\nالدخول: ${fmt(x.entry)}\nالهدف 1: ${fmt(x.tp1)}\nالهدف 2: ${fmt(x.tp2)}\nوقف الخسارة: ${fmt(x.sl)}\nالأسباب: ${x.why.join(' + ')}\nالقوة: ${x.score}/5\n⚠️ ليست نصيحة مالية`}
function draw(d){
  const l=d.list||[],L=l.filter(x=>x.long).length;
  $('n1').textContent=d.total||'-';$('n2').textContent=l.length;$('n3').textContent=L+' / '+(l.length-L);
  const v=l.filter(x=>F==='a'||(F==='L')===x.long);
  $('list').innerHTML=d.err?`<div class="emp">${d.err}</div>`:!v.length?'<div class="emp">ما في فرص تحقق الشروط حالياً.<br>التطبيق بيفحص لحاله وبيبلغك لما تظهر فرصة.</div>':'';
  v.forEach(x=>{const c=document.createElement('div');c.className='c '+(x.long?'L':'S');
    const rr=(Math.abs(x.tp1-x.entry)/Math.abs(x.entry-x.sl)).toFixed(1);
    c.innerHTML=`<div class="h"><span class="sym">${x.sym}</span><span class="bd">${x.long?'شراء LONG':'بيع SHORT'}</span></div>
    <div class="m">${[1,2,3,4,5].map(i=>`<i class="${i<=x.score?'f':''}"></i>`).join('')}</div>
    <div class="g"><div class="e"><span>الدخول</span><b>${fmt(x.entry)}</b></div><div class="s"><span>وقف الخسارة (${x.risk.toFixed(2)}%)</span><b>${fmt(x.sl)}</b></div>
    <div class="p"><span>هدف 1 (${rr}R)</span><b>${fmt(x.tp1)}</b></div><div class="p"><span>هدف 2 (${(rr*2).toFixed(1)}R)</span><b>${fmt(x.tp2)}</b></div></div>
    <div class="w">${x.why.map(w=>`<em>${w}</em>`).join('')}</div><button class="cp">نسخ تفاصيل الفرصة</button>`;
    c.querySelector('.cp').onclick=e=>{A.copy(msg(x));e.target.textContent='تم النسخ ✓'};$('list').appendChild(c)})
}
function tick(){
  if(!A){$('stt').textContent='افتح من داخل التطبيق';return}
  const raw=A.get(),b=A.busy(),d=JSON.parse(raw);
  $('dt').className='dot'+(b?' b':'');$('rf').disabled=b;
  $('stt').textContent=b?'جاري فحص السوق...':d.time?`آخر تحديث ${new Date(d.time).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})} • ${d.ex}`:'بانتظار أول فحص...';
  if(raw!==cur){cur=raw;draw(d)}
}
$('rf').onclick=()=>A&&A.scan();
$('sg').onclick=e=>{const f=e.target.dataset.f;if(!f)return;F=f;[...$('sg').children].forEach(x=>x.classList.toggle('on',x===e.target));draw(JSON.parse(A.get()))};
tick();setInterval(tick,3000);
</script></body></html>
