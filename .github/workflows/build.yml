name: Build All Apps

on: [push, workflow_dispatch]

jobs:
  build-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || gradle wrapper

      - name: Build App (app module)
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Build Admin App (adminapp module)
        run: ./gradlew :adminapp:assembleRelease :adminapp:bundleRelease

      - name: Upload APKs and AABs
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-binaries
          path: |
            app/build/outputs/apk/release/app-release.apk
            adminapp/build/outputs/apk/release/adminapp-release.apk
            app/build/outputs/bundle/release/app-release.aab
            adminapp/build/outputs/bundle/release/adminapp-release.aab
